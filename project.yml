name: ToDo
options:
  bundleIdPrefix: com.mikemadden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    VERSIONING_SYSTEM: apple-generic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ToDo:
    type: application
    platform: iOS
    sources:
      - ToDo
    scheme:
      environmentVariables:
        # Debug runs from Xcode only: pushes the record types to CloudKit's
        # Development environment (see README, "One-time iCloud setup").
        INIT_CLOUDKIT_SCHEMA: "1"
    entitlements:
      path: ToDo/ToDo.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: ToDo/Info.plist
      properties:
        CFBundleDisplayName: To-Do
        CFBundleName: To-Do
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CKSharingSupported: true
        CloudKitContainerID: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        MSClientID: $(MS_CLIENT_ID)
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # When you pick your team in Xcode this becomes com.<TEAMID>.todo,
        # the same ID the TestFlight build uses.
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).todo
        PRODUCT_NAME: ToDo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        # Azure app registration's Application (client) ID for the To Do import.
        MS_CLIENT_ID: 9b1d6e41-5195-4cc5-a0e2-1e00dd2c36e0
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
